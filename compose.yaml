services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-intertext}
      POSTGRES_USER: ${POSTGRES_USER:-intertext}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: ${INTERTEXT_BUILD_TARGET:-development}
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:?Set DATABASE_URL_DOCKER in .env}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    init: true
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app/backend
          ignore:
            - pyproject.toml
            - Dockerfile
            - .pytest_cache/
            - __pycache__/
            - "*.pyc"
        - action: rebuild
          path: ./backend/pyproject.toml
        - action: rebuild
          path: ./pyproject.toml
        - action: rebuild
          path: ./ingestion/pyproject.toml
        - action: rebuild
          path: ./uv.lock
        - action: rebuild
          path: ./backend/Dockerfile

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: ${INTERTEXT_BUILD_TARGET:-development}
      args:
        INTERTEXT_BACKEND_URL: http://backend:8000
    environment:
      INTERTEXT_BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /app
          ignore:
            - package.json
            - package-lock.json
            - Dockerfile
            - node_modules/
            - .next/
            - coverage/
            - "*.tsbuildinfo"
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/Dockerfile

volumes:
  postgres_data:
